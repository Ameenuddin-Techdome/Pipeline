name: Build & Deploy Medusa Storefront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    outputs:
      app_service_name: ${{ steps.app_name.outputs.name }}

    steps:
      # 1. Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Azure login for Terraform
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Export Terraform Variables
      - name: Export Terraform TF_VAR environment variables
        run: |
          echo "TF_VAR_backend_url=${{ secrets.TF_VAR_BACKEND_URL }}" >> $GITHUB_ENV
          echo "TF_VAR_acr_login_server=${{ secrets.TF_VAR_ACR_LOGIN_SERVER }}" >> $GITHUB_ENV
          echo "TF_VAR_acr_username=${{ secrets.TF_VAR_ACR_USERNAME }}" >> $GITHUB_ENV
          echo "TF_VAR_acr_password=${{ secrets.TF_VAR_ACR_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_publishable_key=${{ secrets.TF_VAR_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          echo "TF_VAR_strapi_url=${{ secrets.TF_VAR_STRAPI_URL }}" >> $GITHUB_ENV

      # 5. Terraform Init
      - name: Terraform Init
        working-directory: storefront-tf
        run: terraform init

      # 6. Terraform Plan
      - name: Terraform Plan
        working-directory: storefront-tf
        run: terraform plan -input=false -var-file="storefront-vars.tfvars"

      # 7. Terraform Apply
      - name: Terraform Apply
        working-directory: storefront-tf
        run: terraform apply -input=false -auto-approve -var-file="storefront-vars.tfvars"

      # 8. Get App Service name from Terraform output
      - name: Get App Service Name
        id: app_name
        working-directory: storefront-tf
        run: |
          echo "name=$(terraform output -raw medusa_app_service_name)" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: terraform-deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/medusa-storefront:latest ./my-medusa-store-storefront

      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/medusa-storefront:latest

  deploy-to-app-service:
    runs-on: ubuntu-latest
    needs: [terraform-deploy, build-and-push]

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.terraform-deploy.outputs.app_service_name }}
          images: '${{ secrets.ACR_NAME }}.azurecr.io/medusa-storefront:latest'