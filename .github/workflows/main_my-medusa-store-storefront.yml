jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies and build storefront
        working-directory: ./my-medusa-store-storefront
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: storefront-artifact
          path: ./my-medusa-store-storefront/.next # Or your build output folder

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: storefront-artifact

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "my-medusa-store-storefront"
          slot-name: "Production"
          package: ./ # points to artifact folder
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_41A7A15E5C4D428AA5B1BEA311C1A472 }}

          
